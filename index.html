<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#173f35" />
    <meta
      name="description"
      content="A quiet, offline companion for your daily Quran revision. Qalun an Nafiʿ."
    />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <link rel="stylesheet" href="./style.css" />
    <title>Hifz — Your daily revision</title>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="#today" aria-label="Hifz home"
          ><span class="brand-mark" aria-hidden="true">۞</span
          ><span
            ><strong>hifz<span class="brand-dot">.</span></strong></span
          ></a
        >
        <div class="header-actions">
          <span class="riwayah" lang="ar" dir="rtl">قالون عن نافع</span
          ><button id="settings-open" class="icon-button" aria-label="Settings">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path
                d="M10 2h4l.5 3 1.5.8 2.8-1 2.4 4.2L19 11v2l2.2 2-2.4 4.2-2.8-1-1.5.8L14 22h-4l-.5-3-1.5-.8-2.8 1L2.8 15 5 13v-2L2.8 9l2.4-4.2 2.8 1L9.5 5Z"
              />
              <circle cx="12" cy="12" r="3" />
            </svg>
          </button>
        </div>
      </header>
      <div id="notice" class="notice" role="status" hidden></div>
      <div id="save-error" class="notice error" role="alert" hidden></div>
      <main id="main" tabindex="-1"><div class="loading" role="status">Preparing your revision…</div></main>
      <nav class="navigation" aria-label="Main navigation">
        <a href="#today" data-view="today"
          ><svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="4" width="18" height="17" rx="3" />
            <path d="M7 2v4m10-4v4M3 10h18m-13 5 3 3 5-5" /></svg
          ><span>Today</span></a
        >
        <a href="#library" data-view="library"
          ><svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M12 5c-3-2-6-2-9-1v15c3-1 6-1 9 1 3-2 6-2 9-1V4c-3-1-6-1-9 1Zm0 0v15M6 8h3m6 0h3M6 12h3m6 0h3"
            /></svg
          ><span>Memorization</span></a
        >
        <a href="#mistakes" data-view="mistakes"
          ><svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m15 4 5 5M4 20l5-1L21 7a2 2 0 0 0-5-5L4 14v6ZM4 20h16" /></svg
          ><span>Mistakes</span></a
        >
      </nav>
    </div>
    <dialog id="modal" aria-labelledby="modal-title">
      <div class="modal-heading">
        <h2 id="modal-title"></h2>
        <button id="modal-close" class="icon-button" aria-label="Close dialog">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            aria-hidden="true"
          >
            <path d="m6 6 12 12M18 6 6 18" />
          </svg>
        </button>
      </div>
      <p id="modal-error" class="form-error" role="alert" hidden></p>
      <div id="modal-body"></div>
    </dialog>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <noscript
      ><p class="notice">
        Hifz needs JavaScript to save your passages and calculate your review plan.
      </p></noscript
    >
    <script type="module" src="./app.js"></script>
  </body>
</html>
