name: Publish Hifz app source
on:
  push:
    branches: [main]
    paths:
      - source.tar.gz.b64
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract app
        run: |
          test -f source.tar.gz.b64
          base64 -d source.tar.gz.b64 | tar -xz
          rm source.tar.gz.b64
      - name: Commit app files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish Hifz Qalun PWA' || exit 0
          git push
